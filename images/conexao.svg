<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .bg        { fill: #0d1117; }
      .board     { fill: #1f6b3a; stroke: #15492a; stroke-width: 2; }
      .hole      { fill: #0d1117; stroke: #d9b65c; stroke-width: 3; }
      .port      { fill: #c9ccd1; stroke: #6b6f76; stroke-width: 1.5; }
      .port-dark { fill: #3a3d42; stroke: #6b6f76; stroke-width: 1.5; }
      .iconfill  { fill: #2b2f36; stroke: #c9ccd1; stroke-width: 3; }
      .icon      { fill: none; stroke: #c9ccd1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .lens      { fill: #6fa8ff; opacity: 0.85; }
      .wire      { fill: none; stroke: #d9b65c; stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; }
      .wire-pwr  { fill: none; stroke: #ff7a5c; stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; }
      .wire-hdmi { fill: none; stroke: #7cd992; stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; }
      .label     { fill: #e6edf3; font-size: 18px; font-weight: 700; }
      .sub       { fill: #9aa4b2; font-size: 14px; }
      .tag       { fill: #0d1117; stroke: #6b6f76; stroke-width: 1.5; }
      .tagtext   { fill: #c9ccd1; font-size: 13px; }
      .porttext  { fill: #9aa4b2; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="540"/>

  <!-- ===================== ÓCULOS (esquerda, mesma altura da porta USB) ===================== -->
  <g transform="translate(40,245)">
    <rect class="iconfill" x="0" y="0" width="140" height="65" rx="20"/>
    <circle class="lens" cx="40" cy="32" r="20"/>
    <circle class="lens" cx="98" cy="32" r="20"/>
    <path class="icon" d="M0,22 C-22,22 -22,65 0,65" />
    <path class="icon" d="M140,22 C162,22 162,65 140,65" />
    <text x="70" y="-14" text-anchor="middle" class="label">Óculos DJI (N3)</text>
    <text x="70" y="85" text-anchor="middle" class="sub">saída USB-C</text>
  </g>

  <path class="wire" d="M182,277 L250,277"/>
  <rect class="tag" x="255" y="255" width="110" height="44" rx="6"/>
  <text x="310" y="273" text-anchor="middle" class="tagtext">adaptador OTG</text>
  <text x="310" y="289" text-anchor="middle" class="tagtext">USB-C → USB-A</text>

  <path class="wire" d="M365,277 L420,277"/>
  <rect class="tag" x="425" y="255" width="130" height="44" rx="6"/>
  <text x="490" y="273" text-anchor="middle" class="tagtext">cabo USB-A →</text>
  <text x="490" y="289" text-anchor="middle" class="tagtext">micro-USB</text>

  <path class="wire" d="M555,277 L602,277 L602,280"/>

  <!-- ===================== FONTE DE ENERGIA (acima, reta até PWR IN) ===================== -->
  <g transform="translate(635,30)">
    <rect class="iconfill" x="0" y="8" width="56" height="32" rx="5"/>
    <rect class="iconfill" x="56" y="17" width="9" height="14" rx="2"/>
    <rect fill="#6fa8ff" x="10" y="18" width="36" height="12" rx="2"/>
    <text x="32" y="-10" text-anchor="middle" class="label">Fonte de energia</text>
    <text x="32" y="63" text-anchor="middle" class="sub">micro-USB, 5V</text>
  </g>
  <path class="wire-pwr" d="M670,105 L670,280"/>

  <!-- ===================== PLACA (centro) ===================== -->
  <g transform="translate(555,160)">
    <rect class="board" x="0" y="0" width="230" height="160" rx="12"/>
    <circle class="hole" cx="18" cy="18" r="9"/>
    <circle class="hole" cx="212" cy="18" r="9"/>
    <circle class="hole" cx="18" cy="142" r="9"/>
    <circle class="hole" cx="212" cy="142" r="9"/>
    <rect x="18" y="28" width="194" height="10" fill="#0d1117" opacity="0.25"/>

    <!-- porta USB (recebe os óculos) -->
    <rect class="port" x="30" y="120" width="35" height="20"/>
    <text x="47" y="156" text-anchor="middle" class="porttext">USB</text>

    <!-- porta PWR IN -->
    <rect class="port" x="97" y="120" width="35" height="20"/>
    <text x="114" y="156" text-anchor="middle" class="porttext">PWR IN</text>

    <!-- porta HDMI -->
    <rect class="port-dark" x="165" y="120" width="35" height="20"/>
    <text x="182" y="156" text-anchor="middle" class="porttext">HDMI</text>
  </g>
  <text x="670" y="345" text-anchor="middle" class="label">Pi Zero W / Zero 2 W</text>

  <!-- ===================== HDMI -> TV (direita) ===================== -->
  <path class="wire-hdmi" d="M737,300 L737,330 L800,352"/>
  <g transform="translate(805,320)">
    <rect class="iconfill" x="0" y="0" width="90" height="60" rx="6"/>
    <rect class="iconfill" x="35" y="60" width="20" height="16"/>
    <rect class="iconfill" x="15" y="76" width="60" height="8" rx="2"/>
    <text x="45" y="-12" text-anchor="middle" class="label">TV / monitor</text>
  </g>

  <text x="500" y="490" text-anchor="middle" class="sub">
    a energia é sempre separada: o cabo dos óculos não alimenta o Pi
  </text>
</svg>
